<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <script src="JS_login_screen/login.js" defer></script>
    <link rel="stylesheet" href="CSS_login_screen/login.css">
    <style>
        #error-msg {
            display: none;
            color: red; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="login-card login-container">
<div style="text-align: center;">
                <img src="../../assets/logo.png" alt="Logo" style="display: block; margin: 0 auto 20px auto; max-width: 80px; height: auto;">
            </div>

            <h2> Acesso ao Sistema</h2>
            <hr class="divider">
            
            <h3 class="subtitle">Entrar</h3>
            <hr class="divider">

            <form id="loginForm" method="POST" action="PHP_Login_screen/logar.php">
                <div class="input-group">
                    <label for="masp">MASP (Matrícula):</label>
                    <input type="text" id="masp" name="masp" maxlength="9" placeholder="Digite seu MASP" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha:</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="senha" placeholder="Digite sua senha" required>
                        <button type="button" class="btn-show-password">Mostrar</button>
                    </div>
                </div>

                <div class="error-message" id="error-msg">
                    MASP ou senha incorretos.
                </div>

                <div class="actions button-group">
                <button type="submit" class="btn-entrar">Entrar</button>
                <a href="cadastro.html" class="btn-cadastro" style="text-decoration: none; display: inline-block; text-align: center;">Solicitar Cadastro</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
